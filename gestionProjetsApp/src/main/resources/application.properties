spring.application.name=covoiturage-mini-projet

# Configuration du serveur
server.port=8081

# Configuration de la base de données
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/DatabaseCovoiturage?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuration de JPA et Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CONSEIL : utiliser update pour éviter les erreurs de FK fantômes
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:covoiturageSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm2024}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:4200}
